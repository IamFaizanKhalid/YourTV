
<svg xmlns="http://www.w3.org/2000/svg"
    width="200"
    height="200"
    viewBox="0 0 200 200">

    <!-- TV frame -->
    <rect x="17" y="39"
        width="164" height="115"
        rx="24"
        fill="#808080"/>

    <!-- TV screen -->
    <rect x="19" y="41"
        width="160" height="109"
        rx="24"
        fill="#E53935"/>

    <!-- Play button -->
    <path d="M82 65 L82 123 L135 94 Z"
        fill="#FFFFFF"/>

    <!-- LIVE badge -->
    <rect x="116" y="124"
        width="52" height="20"
        rx="10"
        fill="#A80F17"/>

    <!-- LIVE indicator -->
    <circle cx="127" cy="134"
        r="3"
        fill="#FFAAA5"/>

    <!-- LIVE text -->
    <text x="146" y="137.5"
        font-family="Arial"
        font-size="9"
        font-weight="bold"
        text-anchor="middle"
        fill="#FFFFFF">LIVE</text>

    <!-- TV stand -->
    <rect x="64" y="156"
        width="70" height="4"
        rx="3"
        fill="#808080"/>

</svg>
